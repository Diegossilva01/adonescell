<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0a63ff">
  <title>Mensalidade expirada | ADONESCELL</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px;background:#f1f5fc;color:#13223b;font-family:Arial,sans-serif}
    main{width:100%;max-width:480px;padding:40px 28px;text-align:center;background:#fff;border:1px solid #dfe7f4;border-radius:24px;box-shadow:0 20px 60px #13223b12}

    h1{margin:0 0 16px;font-size:clamp(25px,6vw,32px);line-height:1.15}
    p{margin:0 0 14px;font-size:16px;line-height:1.6;color:#52627c}
    .phone{display:inline-block;margin:4px 0 26px;color:#13223b;font-size:23px;font-weight:bold;text-decoration:none}
    .button{display:block;padding:16px;background:#0a63ff;color:white;border-radius:12px;text-decoration:none;font-size:16px;font-weight:bold}
    .button:hover{background:#084fc9}
    a:focus-visible{outline:3px solid #996000;outline-offset:5px}
    @media(max-width:360px){main{padding:32px 18px}.phone{font-size:21px}}
  </style>
</head>
<body>
  <main aria-labelledby="notice-title">

</body>
</html>
